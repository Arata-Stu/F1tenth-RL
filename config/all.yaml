defaults:
  - reward: ??? ## tal ir progress

envs:
  timestep: 0.01 ## シミュレータの時間間隔
  num_beams: 1080 ## 2d Lidarのビーム数
  beam_fov: 4.7 ## 2d Lidarの範囲 -135° ~ 135°
  max_beam_range: 30.0 ## 2d Lidarの最大距離
  num_agents: 1
  steer_range: 0.4 ## ステアリングの範囲
  speed_range: 10.0 ## 車両の速度範囲
  render_mode: human_fast ## human or human_fast

  map:
      name: Austin ## マップの名前
      ext: .png ## マップの拡張子
      line_type: race ## center race
      speed: 6.0 ## waypointの速度
      downsample: 1 ## マップのダウンサンプリング

      ## planner用の設定
      use_dynamic_speed: false ## 動的な速度を使用するかどうか
      a_lat_max: 1.0 ## 最大横加速度
      smooth_sigma: 3 ## スムージングのsigma

buffer:
  name: off_policy
  buffer_size: 100000
  state_shape: ${agent.actor.state_dim}
  action_dim: ${agent.actor.action_dim}

agent:
  name: sac
  actor:
    name: 1dconv ## 1dconv or mlp
    state_dim: 1080
    action_dim: 2
    hidden_dim: 256
    lr: 0.0003

  critic:
    name: ${agent.actor.name}
    state_dim: ${agent.actor.state_dim}
    action_dim: ${agent.actor.action_dim}
    hidden_dim: ${agent.actor.hidden_dim}
    lr: 0.0003

  alpha_lr: 0.0003
  target_entropy: null
  tau: 0.005
  gamma: 0.99



## 基本設定

## 車両の物理パラメータ
vehicle:
  ## 公式から引用
  mu: 1.0489
  C_Sf: 4.718
  C_Sr: 5.4562
  lf: 0.15875
  lr: 0.17145
  h: 0.074
  m: 3.74
  I: 0.04712
  s_min: -0.4
  s_max: 0.4
  sv_min: -3.2
  sv_max: 3.2
  v_switch: 7.319
  a_max: 9.51
  v_min: -5.0
  v_max: 10.0
  width: 0.31
  length: 0.58

planner:
  wheelbase: 0.33 ## そのままで良い
  lookahead: 0.5 ## 前方を見る距離
  gain: 0.5 ## 速度に応じて前方を見る距離を変える時の倍率
  max_reacquire: 20.0 ## そのままで良い
